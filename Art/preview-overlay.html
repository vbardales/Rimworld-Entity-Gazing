<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Entity Gazing Preview</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:896px; height:504px; overflow:hidden; }
body { font-family:"Segoe UI",system-ui,sans-serif; }
.scene,.veil { position:absolute; inset:0; width:896px; height:504px; }
.scene { object-fit:cover; }
.veil { background:radial-gradient(circle at 0% 0%,rgb(var(--veilRGB) / .86) 0%,rgb(var(--veilRGB) / 0) 74%); }
.copy { position:absolute; left:50px; top:54px; color:var(--inkPrimary); text-shadow:0 3px 10px rgba(0,0,0,.75); }
h1 { font-size:46px; font-weight:600; line-height:1.1; letter-spacing:0; }
h1 .secondary { font-size:.65em; color:var(--inkSecondary); }
h1 .link { font-size:.65em; }
.tag { font-size:24px; font-weight:400; line-height:1.1; letter-spacing:.2px; margin-top:8px; color:var(--inkSecondary); }
.rule { width:58px; height:3px; background:var(--accent); margin-top:20px; margin-bottom:16px; }
p { width:430px; font-size:21px; font-weight:400; line-height:1.45; letter-spacing:0; }
.badge { position:absolute; right:0; top:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%); }
.version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); font-size:26px; font-weight:700; line-height:1; color:var(--badgeInk); }
</style>
<img class="scene" src="Preview.png" alt=""><div class="veil"></div>
<main class="copy"><h1>Entity Gazing</h1><div class="rule"></div><p>Colonists watch the horrors you keep chained up, as recreation.</p></main>
<div class="badge"></div><div class="version"></div>
<script>
window.previewReady=(async()=>{
 const palette=await (await fetch('preview-palette.json')).json();
 for(const [k,v] of Object.entries(palette)) document.documentElement.style.setProperty('--'+k,v);
 document.documentElement.style.setProperty('--veilRGB',palette.veil.slice(1).match(/../g).map(x=>parseInt(x,16)).join(' '));
 const xml=new DOMParser().parseFromString(await (await fetch('../Mod/About/About.xml')).text(),'application/xml');
 const versions=[...xml.querySelectorAll('supportedVersions li')].map(x=>x.textContent.trim()).filter(x=>/^\d+\.\d+$/.test(x)).sort((a,b)=>{const aa=a.split('.').map(Number),bb=b.split('.').map(Number);return bb[0]-aa[0]||bb[1]-aa[1]});
 if(!versions.length) throw Error('No stable supported version');
 document.querySelector('.version').textContent=versions[0];
 await document.fonts.ready; await document.querySelector('.scene').decode();
})();
</script></html>
